name: macOS arm64 Build (SophiaIDE)

on:
  workflow_dispatch:
  push:
    branches: [ sophia ]

jobs:
  build-darwin-arm64:
    runs-on: macos-14
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - name: Install deps (root/extensions)
        run: npm ci
      - name: Build product (darwin arm64, non-min)
        run: npm run gulp vscode-darwin-arm64
      - name: Package darwin app
        run: |
          set -e
          cd .build
          if [ -d VSCode-darwin-arm64 ]; then
            cd VSCode-darwin-arm64
          elif [ -d vscode-darwin-arm64 ]; then
            cd vscode-darwin-arm64
          else
            echo "No darwin-arm64 folder found in .build" >&2
            ls -la
            exit 1
          fi
          zip -qry ../../VSCode-darwin-arm64.zip .
          cd ../..
          ls -la VSCode-darwin-arm64.zip || true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sophiaide-darwin-arm64
          path: VSCode-darwin-arm64.zip
          if-no-files-found: error
