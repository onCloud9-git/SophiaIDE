name: macOS arm64 Build (SophiaIDE)

on:
  workflow_dispatch:
  push:
    branches: [ sophia ]

jobs:
  build-darwin-arm64:
    runs-on: macos-14
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - name: Install deps (root/extensions)
        run: npm ci
      - name: Compile core (with mangling)
        run: npm run compile-build
      - name: Compile extensions (build)
        run: npm run compile-extensions-build
      - name: Minify vscode (build)
        run: npm run minify-vscode
      - name: Package darwin arm64 (min-ci)
        run: npm run gulp vscode-darwin-arm64-min-ci
      - name: Package darwin app zip
        run: |
          set -e
          cd .build
          folder=""
          if [ -d VSCode-darwin-arm64 ]; then folder=VSCode-darwin-arm64; fi
          if [ -z "$folder" ] && [ -d vscode-darwin-arm64 ]; then folder=vscode-darwin-arm64; fi
          if [ -z "$folder" ]; then echo "No darwin-arm64 folder found in .build" >&2; ls -la; exit 1; fi
          (cd "$folder" && zip -qry ../../VSCode-darwin-arm64.zip .)
          ls -la ../VSCode-darwin-arm64.zip || true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sophiaide-darwin-arm64
          path: VSCode-darwin-arm64.zip
          if-no-files-found: error
